name: Scan EU R&I geopolitics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eu-ri-geopolitics-scanner
  cancel-in-progress: false

jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check scanner password is configured
        env:
          SCANNER_PASSWORD: ${{ secrets.SCANNER_PASSWORD }}
        run: |
          if [ -z "$SCANNER_PASSWORD" ]; then
            echo "::error::Missing repository secret SCANNER_PASSWORD"
            exit 1
          fi

      - name: Run scanner
        env:
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python scanner.py --max-seconds 1200

      - name: Build encrypted page
        env:
          SCANNER_PASSWORD: ${{ secrets.SCANNER_PASSWORD }}
        run: python build_page.py

      - name: Persist scanner state and findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/findings.json data/seen.json data/state.json docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update geopolitics scan"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: scan-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
